name: "✨ Funcionalidade"
description: "Propor uma nova capacidade ou melhoria para a Sexta-feira."
title: "feat: "
labels: [funcionalidade]
body:
  - type: markdown
    attributes:
      value: |
        > **Dica:** foque em um único resultado bem definido. Se crescer demais, divida em issues menores.
  - type: textarea
    id: problema
    attributes:
      label: "💡 Problema ou necessidade"
      description: "O que hoje não é possível (ou é difícil) e **por que isso importa**."
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: "🧭 Proposta"
      description: "Como a Sexta-feira deve se comportar depois da mudança."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: "✅ Critérios de aceite"
      description: "O que precisa ser verdade para esta issue ser considerada concluída."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "🗂️ Área"
      description: "Selecione uma ou mais áreas impactadas."
      multiple: true
      options:
        - core
        - adapters
        - cli
        - docs
        - ci
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: "⚖️ Alternativas consideradas"
      description: "Outras abordagens avaliadas e o motivo de não terem sido escolhidas."
  - type: textarea
    id: fora-do-escopo
    attributes:
      label: "🚫 Fora do escopo"
      description: "O que esta issue **não** cobre, para manter a PR enxuta e focada."
