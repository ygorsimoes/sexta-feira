name: Tarefa
description: Manutenção, refatoração, documentação, CI ou um spike.
title: "chore: "
labels: [tarefa]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que precisa ser feito
    validations:
      required: true
  - type: textarea
    id: por-que
    attributes:
      label: Por quê
      description: O que melhora ou o que se quer descobrir (no caso de um spike).
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Pronto quando
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      multiple: true
      options:
        - core
        - adapters
        - cli
        - docs
        - ci
    validations:
      required: true
