name: Auditoria

# Avisos de segurança novos aparecem sem ninguém mexer no código; por isso a verificação é agendada.
on:
  schedule:
    - cron: "0 11 * * 1" # segunda-feira, 08:00 em São Paulo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Avisos de segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
