[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ygorsimoes/sexta-feira"
publish = false

[workspace.dependencies]
sexta-feira-core = { path = "crates/sexta-feira-core" }
sexta-feira-adapters = { path = "crates/sexta-feira-adapters" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

assert_cmd = "2.2.2"
insta = "1.49.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
